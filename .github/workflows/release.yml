name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.10"
          cache: false
      - name: Install the pinned task runner
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run the repository gate
        run: task check
      - name: The tag, the workspace and the changelog agree
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "b10x-worktree-cli") | .version')
          test "$version" = "$GITHUB_REF_NAME" || { echo "::error::workspace is $version, tag is $GITHUB_REF_NAME" >&2; exit 1; }
          grep -q "^## ${GITHUB_REF_NAME} — " CHANGELOG.md || { echo "::error::CHANGELOG.md has no dated ${GITHUB_REF_NAME} section" >&2; exit 1; }

  package:
    name: Package ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor lower than `ubuntu-latest` for downloaded binaries.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build, smoke-test and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --locked --release --bin worktree --target "$TARGET"
          bin="target/$TARGET/release/worktree"
          printed=$("$bin" --version | awk '{print $NF}')
          if [ "$printed" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the built binary reports $printed, but the release tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
          package="worktree-$GITHUB_REF_NAME-$TARGET"
          mkdir -p "dist/$package"
          cp "$bin" LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: [gate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify archives and write checksums
        run: |
          set -euo pipefail
          cd dist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            test -f "worktree-$GITHUB_REF_NAME-$target.tar.gz" || { echo "::error::missing worktree-$GITHUB_REF_NAME-$target.tar.gz" >&2; exit 1; }
          done
          sha256sum worktree-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      # A release written by hand before the tag keeps its notes; otherwise the annotated tag's
      # message becomes them. Either way the archives are attached, idempotently.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            notes="${RUNNER_TEMP}/notes.md"
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$notes"
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Worktree $GITHUB_REF_NAME" --notes-file "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
