name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@db7edb1ca0ee4e920d75b1b067d83f1b2ed2ee4d
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
