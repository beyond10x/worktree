name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@253e3f061636da05fa5acc26ff3fb81ff2208cb3
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
