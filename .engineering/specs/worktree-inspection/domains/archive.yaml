domain: worktree.archive

types:
  # What one entry of a nested repository image is. Fifos, sockets and devices are refused as
  # archive-unsupported-entry; a hard link is imaged as an independent regular file.
  - name: worktree.archive.ImageEntryKind
    kind: enum
    variants: [File, Directory, Symlink]

  # The verdict `prune-archives` gives one archive directory. Removable only when every commit the
  # archive records is on a remote and it holds no uncommitted state; each other variant is a
  # refusal that names why, and no flag turns a refusal into a removal.
  #   Removable: HEAD and every unique commit are ancestors of a ref freshly advertised by a
  #     configured remote of repository_root, the manifest records no patch and no nested
  #     repository image, the registered tree path is absent, and the directory holds only the
  #     files the manifest names.
  #   CommitsNotOnRemote: some recorded commit is an ancestor of no freshly advertised ref.
  #     Patch equivalence does not count: the archive is then the only copy of those commits.
  #   UncommittedState: the manifest records a patch (worktree_tree differs from HEAD's tree).
  #   NestedRepositories: the manifest records at least one nested repository image.
  #   TreeStillPresent: the registered tree path exists; the archive may be its recovery proof.
  #   RemoteProofUnavailable: repository_root is gone, has no configured remote, or no remote
  #     answered; offline is a refusal, never permission.
  #   UnrecordedContent: the directory holds an entry the manifest does not name.
  #   InvalidManifest: manifest.json is missing, unreadable or of an unknown format.
  - name: worktree.archive.PruneVerdict
    kind: enum
    variants: [Removable, CommitsNotOnRemote, UncommittedState, NestedRepositories, TreeStillPresent, RemoteProofUnavailable, UnrecordedContent, InvalidManifest]

  # The verdict `prune-archives --strip-build-output` gives one archive directory, checked in this
  # order. Only Strippable is rewritten under --apply; every refusal leaves the archive untouched.
  #   InvalidManifest: manifest.json is missing, unreadable or of an unknown format.
  #   UnrecordedContent: the directory holds an entry the manifest does not name.
  #   TreeStillPresent: the registered tree path exists; the archive may be its recovery proof.
  #   RepositoryGone: repository_root is gone, so the new patch cannot be verified over HEAD.
  #   PatchUnusable: dirty.patch no longer has its recorded digest, holds bytes before its first
  #     `diff --git` section, or the stripped patch does not apply over HEAD.
  #   NothingToStrip: no patch, or no `new file mode` section whose path is build layout.
  #   Strippable: at least one `new file mode` section adds a file under build layout.
  - name: worktree.archive.StripVerdict
    kind: enum
    variants: [Strippable, NothingToStrip, InvalidManifest, UnrecordedContent, TreeStillPresent, RepositoryGone, PatchUnusable]

  # How a left-out file was found to be cargo build layout.
  #   Archive: `archive` observed it on disk below a target `discard-cache` recognises by structure.
  #   Strip: `--strip-build-output` found its `new file mode` section in an existing patch, below a
  #     directory for which the patch holds `T/CACHEDIR.TAG`, `T/.rustc_info.json` or
  #     `T/<p>/.fingerprint/…`.
  - name: worktree.archive.BuildOutputOrigin
    kind: enum
    variants: [Archive, Strip]

# The manifest of one local archive (crates/worktree-domain/src/archive.rs, ArchiveManifest). It
# stands in for remote recovery proof. Only `prune-archives --apply` deletes one, and only an
# archive assessed Removable (worktree.archive.PruneVerdict) in the same run. Its worktree is the
# existing registry record (crates/worktree-domain/src/lib.rs, WorktreeRecord).
entities:
  - name: worktree.archive.Archive
    identity:
      name: worktree_id
      type: String
    fields:
      # worktree.archive/1 when the archive images no nested repository and leaves nothing out;
      # worktree.archive/2, which adds the images, when it images at least one and leaves nothing
      # out; worktree.archive/3, which adds build_output (and may hold images), when it left cargo
      # build layout out. Formats 1 and 2 are immutable; readers accept all three, and an archive
      # with nothing left out is written exactly as format 1 or 2.
      - name: format
        type: String
      - name: head
        type: String
      # Commits HEAD adds over every advertised remote ref; commits.bundle carries them.
      - name: unique_commits
        type: Integer
      # Git tree id of the tree's on-disk content outside every imaged nested repository and,
      # in format 3, outside the cargo build layout it left out.
      - name: worktree_tree
        type: String
      - name: created_at
        type: Integer
      # Format 3 only: totals over build_output, absent (0) in formats 1 and 2.
      - name: build_output_files
        type: Integer
      - name: build_output_bytes
        type: Integer
    invariants:
      - unique_commits >= 0
      - build_output_files >= 0
      - build_output_bytes >= 0
    relations:
      - name: nested_repositories
        kind: owns
        target: worktree.archive.NestedRepositoryImage
        cardinality: many
        via: worktree_id
      - name: build_output
        kind: owns
        target: worktree.archive.BuildOutputTarget
        cardinality: many
        via: worktree_id
    lifecycle:
      initial: Written
      states: [Written]
      terminal: [Written]

  # A byte image of one Git repository nested in the tree, typically a test fixture kept in an
  # ignored evidence directory. Git lists such a directory only as `<path>/` and indexes nothing
  # below it, so the patch cannot hold it; the image holds the directory and everything below
  # it, its `.git` included, so committed, staged, unstaged, untracked and stashed state all
  # return with `tar -xpf <image> -C <tree>` (`-p`, so the umask cannot change the permission bits).
  - name: worktree.archive.NestedRepositoryImage
    identity:
      name: image_file
      type: String
    fields:
      - name: worktree_id
        type: String
      # Repository root relative to the tree root.
      - name: path
        type: String
      # SHA-256 and size of the image file's bytes (the manifest's `image`, an ArchiveFile).
      - name: image_sha256
        type: String
      - name: image_bytes
        type: Integer
      # SHA-256 of the canonical listing of the root directory and every entry below it: relative
      # path, entry kind, permission bits, size and the SHA-256 of a file's content or a symlink's
      # target, sorted by path bytes. The image read back and the directory on disk must both
      # produce it.
      - name: fingerprint
        type: String
      - name: entries
        type: Integer
    invariants:
      - entries >= 1
      - image_bytes >= 0
    lifecycle:
      initial: Imaged
      states: [Imaged]
      terminal: [Imaged]
    # Refused rather than imaged, because the repository depends on state outside the tree: a
    # `.git` that is a file or a symlink (a submodule or a linked worktree), a `.git` holding
    # `commondir`, non-empty `objects/info/alternates`, any `worktrees/` entry or any symlink, and a
    # root at or below which HEAD or the index tracks any path (a submodule's gitlink included).

  # Cargo build layout one archive left out, per cargo target directory T (relative to the tree
  # root), in path-byte order. A path is build layout when Git tracks it neither in HEAD nor in
  # the index and its first component under T is `debug`, `release`, `tmp`, `CACHEDIR.TAG`,
  # `.rustc_info.json`, or a profile directory (one holding `.fingerprint/` as a direct child;
  # also `T/<triple>/<profile>/`). Every other path under T, and every other ignored directory,
  # stays in the archive.
  # Removal through a format 3 archive re-observes each left-out path immediately before deleting
  # it: it must still be build layout below this same recognised T and is then deleted as cache;
  # anything else that differs from worktree_tree refuses as archive-stale.
  - name: worktree.archive.BuildOutputTarget
    identity:
      name: path
      type: String
    fields:
      - name: worktree_id
        type: String
      # How the layout was found; one entry per path and origin, in path-byte then origin order,
      # so an archive stripped after it was written may hold both.
      - name: origin
        type: worktree.archive.BuildOutputOrigin
      # Files left out below this target.
      - name: files
        type: Integer
      # Their content bytes: the file sizes on disk (Archive), or the sizes the stripped sections
      # would have recreated (Strip).
      - name: bytes
        type: Integer
    invariants:
      - files >= 1
      - bytes >= 0
    lifecycle:
      initial: LeftOut
      states: [LeftOut]
      terminal: [LeftOut]

  # A report of one archive directory assessed by `prune-archives --strip-build-output`, not a
  # persisted lifecycle. Selection (`--repo`, `--scope repo|profile`, `--id`) and the skipped
  # entries are exactly those of ArchivePruneAssessment. `--dry-run` (the default) writes nothing.
  # `--apply` requires `--id`; per id it re-assesses, writes the new patch beside the old in a
  # scratch dot-directory of the repository's archive directory (never an archive entry; removed
  # on any refusal), verifies in a scratch index that it applies over HEAD (never a tree or the
  # repository's own index) and recomputes worktree_tree from it, then replaces dirty.patch (or
  # deletes it when nothing remains, recording `patch: null`) and writes the format 3 manifest
  # last. Only `new file mode` sections whose C-unquoted path is build layout are stripped; an
  # undecodable path keeps its section, and nested repository images are not touched. Stripping
  # never deletes an archive; removal stays `prune-archives --apply --id` under PruneVerdict.
  - name: worktree.archive.ArchiveStripAssessment
    identity:
      name: archive_directory
      type: String
    fields:
      - name: path
        type: String
      - name: worktree_id
        type: Optional<String>
      - name: repository_root
        type: Optional<String>
      - name: verdict
        type: worktree.archive.StripVerdict
      - name: reason
        type: String
      # Bytes of the regular files in the directory now.
      - name: bytes
        type: Integer
      # Patch bytes the strip removes, and the sections it removes and keeps.
      - name: strip_bytes
        type: Integer
      - name: sections_stripped
        type: Integer
      - name: sections_kept
        type: Integer
      # Bytes of the patch that stays; 0 when nothing remains.
      - name: kept_patch_bytes
        type: Integer
      - name: nested_images
        type: Integer
      # The prune verdict the archive has after the strip; absent for a refusal.
      - name: prune_verdict_after
        type: Optional<worktree.archive.PruneVerdict>
      # true only under --apply, for a Strippable archive that was rewritten.
      - name: applied
        type: Boolean
      # Bytes the rewrite freed; 0 unless applied.
      - name: freed_bytes
        type: Integer
    invariants:
      - bytes >= 0
      - strip_bytes >= 0
      - sections_stripped >= 0
      - sections_kept >= 0
      - kept_patch_bytes >= 0
      - nested_images >= 0
      - freed_bytes >= 0
    lifecycle:
      initial: Assessed
      states: [Assessed]
      terminal: [Assessed]

  # A report of one archive directory assessed by `prune-archives`, not a persisted lifecycle.
  # The directory is `<id>` or a superseded `<id>.superseded-<n>`; `--id` names it. `--dry-run`
  # (the default) deletes nothing. `--apply` takes only exact directory names reviewed in a
  # dry-run, re-assesses each immediately before deleting it, deletes only a Removable one (the
  # files the manifest names, then the manifest, then the empty directory, never recursively),
  # and reports the bytes freed. Every refusal is reported and the archive kept.
  # Without `--id` the selection is worktree.selection.CleanupScope, as for gc: Repository (default)
  # is the archives whose manifest repository_root is the repository `--repo` resolves to; Profile
  # is every archive below the activated profile's archive root.
  # Archives live at `<archive root>/<repository name>/<directory>`. Every directory there whose
  # name does not start with `.` is an archive directory and is assessed; a name starting with `.`
  # (an archive being written) and every file, at either level, is not an archive: it is reported
  # as skipped with its size and never deleted. In Repository scope the skipped entries reported
  # are those below `<archive root>/<repository name>/`. `--id` takes `<directory>` or
  # `<repository name>/<directory>`; a bare directory name two repositories hold is refused as
  # ambiguous, and a name that is no archive directory is refused.
  - name: worktree.archive.ArchivePruneAssessment
    identity:
      name: archive_directory
      type: String
    fields:
      # Absolute path of the archive directory.
      - name: path
        type: String
      # From the manifest; absent when the verdict is InvalidManifest.
      - name: worktree_id
        type: Optional<String>
      - name: repository_root
        type: Optional<String>
      # Why the verdict was given, in words; for Removable, the refs that hold HEAD.
      - name: reason
        type: String
      # Bytes of the regular files in the directory.
      - name: bytes
        type: Integer
      - name: verdict
        type: worktree.archive.PruneVerdict
      # Commits the archive records that no freshly advertised ref holds.
      - name: commits_not_on_remote
        type: Integer
      # true only under --apply, for a Removable archive that was deleted.
      - name: removed
        type: Boolean
    invariants:
      - bytes >= 0
      - commits_not_on_remote >= 0
    lifecycle:
      initial: Assessed
      states: [Assessed]
      terminal: [Assessed]
