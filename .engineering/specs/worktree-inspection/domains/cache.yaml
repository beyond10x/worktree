domain: worktree.cache

types:
  # Why an ignored entry is discarded (crates/worktree-domain/src/cache.rs, CacheKind). Git's own
  # exclude rules decide what is ignored: every ignored entry Git reports is disposable unless the
  # tree's keep file (worktree.cache.KeepFile) keeps it or it is or holds a repository. An ignored
  # directory that holds a kept path or a repository at any depth is never deleted whole; it falls
  # to its direct entries, each classified by the same rule. An ignored entry on another device
  # than the tree root (a mount point) is retained whole. The structural variants below name the
  # build cache an entry was also recognised as; IgnoredOutput is every other disposable entry,
  # file or directory.
  # IgnoredOutput: an ignored file, symbolic link (deleted itself, never followed) or real
  # directory that no structural variant recognises, matches no keep pattern, holds no kept path
  # and is not and holds no repository.
  # CargoTargetTmp: `tmp/` directly below a tagged Cargo target that holds at least one profile,
  # Cargo's CARGO_TARGET_TMPDIR, which test binaries fill with scratch; one holding a nested
  # repository is discarded entry by entry, as below.
  # A Cargo target is tagged by a valid CACHEDIR.TAG. Cargo writes the tag only when it creates
  # the directory, so a `target/` made before Cargo's first build has none. Such a directory
  # counts as tagged when it is named `target`, a tracked `Cargo.toml` sits beside it, and it
  # holds a direct child other than `tmp/` with both `.fingerprint/` and `deps/` as real
  # directories; a CACHEDIR.TAG with a bad signature inside it is kept. The same three
  # kinds then apply; no new variant.
  # FlutterOutput: an ignored real directory `P/build/` or `P/.dart_tool/` that is a Flutter app's
  # output directory (worktree.archive.FlutterOutputKind) by the one build-output classifier
  # `archive` and `prune-archives --strip-build-output` use: `P/pubspec.yaml` is a regular file on
  # disk beside it, and neither HEAD's tree nor the index holds anything at or below the
  # directory. A `build/` with no `pubspec.yaml` beside it is retained.
  # A nested repository is never cache, whatever kind of directory holds it: it may hold commits
  # and files no remote does. A recognised directory of any kind that holds a `.git` (file,
  # directory or symbolic link) at any depth below it, found by a walk that follows no symbolic
  # link (an entry it cannot read counts as one), is not deleted whole. A whole Cargo target
  # holding one falls to its parts, each discarded under its own rule; Cargo's `tmp/` holding one
  # discards each direct entry holding none; every other directory holding one is retained whole.
  # The walk is repeated immediately before each deletion, and a directory that holds a `.git`
  # then is retained whole. `archive` images each retained repository; nothing else changes.
  - name: worktree.cache.CacheKind
    kind: enum
    variants: [CargoProfile, CargoTarget, CargoTargetTmp, FlutterOutput, NodeModules, PythonVirtualenv, ToolCache, IgnoredOutput]

# A report of one cache discard, not a new persisted lifecycle. The worktree it names is the
# existing registry record (crates/worktree-domain/src/lib.rs, WorktreeRecord).
entities:
  # The repository's list of ignored paths a tree keeps: `.worktreekeep` at the tree root, read
  # from disk as a regular file (a symbolic link or a directory there is refused as
  # `keep-file-invalid`; an absent file keeps nothing). Its lines are Git exclude patterns,
  # matched by Git's own exclude engine against paths relative to the tree root, so negation,
  # directory-only patterns and anchoring behave as in `.gitignore`. A path is kept when a
  # pattern matches it or one of its ancestors. `discard-cache` retains every kept path, and an
  # ignored directory holding one falls to its parts. `prune-archives --strip-build-output`
  # reads the keep file from HEAD's tree, or from the patch when the patch purely adds it, and
  # never strips a kept path.
  - name: worktree.cache.KeepFile
    identity:
      name: path
      type: String
    fields:
      # Non-blank lines that are not comments.
      - name: patterns
        type: Integer
    invariants:
      - patterns >= 0
    lifecycle:
      initial: Read
      states: [Read]
      terminal: [Read]

  - name: worktree.cache.CacheDiscard
    identity:
      name: worktree_id
      type: String
    fields:
      - name: observed_at
        type: Integer
      # false for `discard-cache --dry-run`: the entries were classified, nothing was deleted.
      - name: applied
        type: Boolean
      # Ignored entries that are disposable (worktree.cache.CacheKind): neither kept by the keep
      # file nor a repository nor holding either.
      - name: discarded_entries
        type: Integer
      # Ignored entries kept by the keep file, repositories, and entries on another device.
      # Never deleted; `worktree archive` keeps them.
      - name: retained_ignored_entries
        type: Integer
      # Allocated bytes of those retained entries; a sweep refuses to archive more than its limit.
      - name: retained_bytes
        type: Integer
    lifecycle:
      initial: Observed
      states: [Observed]
      terminal: [Observed]
    # UNMAPPED: no process-ownership noun exists. "In use" is an observation of /proc at the
    # moment of the discard, reported as a refusal, not a field of this report.

  - name: worktree.cache.SweepItem
    identity:
      name: worktree_id
      type: String
    fields:
      # Seconds since the later of the registry's recorded activity and the tree's own Git index,
      # HEAD or HEAD log.
      - name: idle_seconds
        type: Integer
      - name: discarded_entries
        type: Integer
      # True when the sweep wrote an archive for an expired or finished tree.
      - name: archived
        type: Boolean
      # True when the sweep left the record, or part of it, as it was; the refusal names why.
      - name: refused
        type: Boolean
    lifecycle:
      initial: Observed
      states: [Observed]
      terminal: [Observed]
    # A sweep never changes the registry lifecycle and never removes a tree; GC stays review-bound.
