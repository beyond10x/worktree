[workspace]
resolver = "3"
members = [
    "crates/worktree-domain",
    "crates/worktree",
    "crates/worktree-git",
    "crates/worktree-state",
    "crates/worktree-cli",
]

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/worktree"
authors = ["Beyond10x contributors"]
publish = false

[workspace.dependencies]
anyhow = "1"
b10x-worktree-domain = { path = "crates/worktree-domain" }
b10x-worktree = { path = "crates/worktree" }
b10x-worktree-git = { path = "crates/worktree-git" }
b10x-worktree-state = { path = "crates/worktree-state" }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
